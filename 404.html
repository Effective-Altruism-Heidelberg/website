<script>
  // GitHub Pages serves this file for any missing path, at any depth, so
  // relative links need a base. Project sites live under /<repo>/, custom
  // domains and <org>.github.io user sites live at /.
  (function () {
    var seg = location.pathname.split("/")[1] || "";
    var project = /\.github\.io$/.test(location.hostname) && seg &&
                  seg !== "en" && seg !== "de" && seg.indexOf(".") === -1;
    document.write('<base href="' + (project ? "/" + seg + "/" : "/") + '">');
  })();
</script>
