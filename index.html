<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EA Heidelberg</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="assets/fonts/sora-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#0388a0">
<link rel="stylesheet" href="style.css">
<style>
  body{display:flex;min-height:100vh;align-items:center;justify-content:center}
  .gate{text-align:center;padding:2rem}
  .gate .choices{display:flex;gap:1rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap}
</style>
<script>
  (function () {
    var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
    if (lang === "de") location.replace("de/index.html");
    else location.replace("en/index.html");
  })();
</script>
</head>
<body>
  <div class="gate">
    <span class="eyebrow">EA Heidelberg</span>
    <h1>Choose a language / Sprache w&auml;hlen</h1>
    <p class="lede">Redirecting automatically&hellip; if nothing happens, pick one below.</p>
    <div class="choices">
      <a class="btn btn--primary" href="en/index.html">Continue in English</a>
      <a class="btn btn--outline" href="de/index.html">Auf Deutsch weiter</a>
    </div>
  </div>
</body>
</html>
